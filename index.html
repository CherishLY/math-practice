<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数学练习</title>
  <style>
[hidden] { display: none !important; }
.exercise-tabs { display: flex; background: white; border-bottom: 1px solid var(--line); padding: 0 20px; gap: 24px; }
.exercise-tabs button { min-height: 60px; padding: 12px 6px; border: 0; border-bottom: 3px solid transparent; background: transparent; color: var(--muted); font: inherit; font-weight: 800; cursor: pointer; }
.exercise-tabs button[aria-selected="true"] { border-bottom-color: var(--blue); color: var(--blue); }
.exercise-tabs button:focus-visible { outline: 2px solid var(--blue); outline-offset: -4px; }
.cubes-page { padding: 28px; }
.cubes-heading h1 { margin: 0 0 10px; font-size: 25px; }
.cubes-heading p, .cube-reference { color: var(--muted); line-height: 1.6; }
.cube-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-top: 22px; }
.cube-shapes { display: flex; flex-wrap: wrap; gap: 8px; }
.cube-shapes button { padding: 8px 18px; }
.cube-score { display: flex; gap: 10px; flex-wrap: wrap; }
#cubeRight { color: var(--green); } #cubeWrong { color: var(--red); }
.cube-scene { width: 100%; aspect-ratio: 760 / 420; background: #f1f7fa; margin-top: 18px; border-bottom: 1px solid #cedee5; }
.cube-scene svg { display: block; width: 100%; height: 100%; }
.cube-reference { font-size: 14px; text-align: center; margin: 10px 0 24px; }
.cube-answer-form { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 12px; font-size: 18px; }
.cube-answer-form input { width: 80px; height: 52px; border: 2px solid #8aadc9; border-radius: 6px; text-align: center; font: inherit; font-size: 26px; background: white; color: var(--ink); }
.cube-answer-form input:focus { outline: 3px solid #d0e3fa; border-color: var(--blue); }
.cube-feedback { min-height: 30px; text-align: center; font-size: 18px; font-weight: 700; }
.cube-feedback.good { color: var(--green); } .cube-feedback.bad { color: var(--red); }
.cube-explanation { padding: 18px 0; border-top: 1px solid var(--line); margin-bottom: 20px; text-align: center; }
.cube-explanation h2 { font-size: 18px; margin: 0 0 14px; }
.cube-explanation p { line-height: 1.6; margin: 8px 0; }
.cube-layer-plans { display: flex; justify-content: center; flex-wrap: wrap; gap: 20px; }
.cube-layer-plan { display: grid; gap: 4px; justify-content: center; }
.cube-layer-plan i { width: 18px; height: 18px; background: #60bfc1; border: 1px solid #25838c; }
.cube-layer-plan.cylinder-plan i { border-radius: 50%; background: #c6b9ed; border-color: #7864ad; }
.cube-layer-plan.cuboid-plan i { background: #f5cc91; border-color: #a77634; }
.cube-layer { min-width: 90px; }
@media (max-width: 680px) {
  .cubes-page { padding: 20px 14px; }
  .cubes-heading h1 { font-size: 22px; }
  .exercise-tabs { gap: 20px; padding: 0 14px; }
  .cube-scene { aspect-ratio: 1.5; }
  .cube-answer-form { gap: 8px; font-size: 16px; }
}

.exercise-tabs { gap: 20px; flex-wrap: wrap; }
.comparison-page { padding: 28px; }
.comparison-heading h1 { font-size: 25px; margin: 0 0 10px; }
.comparison-heading p { color: var(--muted); margin-bottom: 24px; }
.comparison-modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.comparison-modes button { padding: 10px 6px; }
.comparison-ranges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.comparison-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; margin: 28px 0; font-size: 16px; }
#comparisonRight { color: var(--green); }
#comparisonWrong { color: var(--red); }
.comparison-question { display: grid; grid-template-columns: minmax(0, 1fr) 76px minmax(0, 1fr); align-items: center; gap: 20px; min-height: 180px; font-size: 44px; font-weight: 800; text-align: center; background: #f0f7fa; padding: 24px 12px; }
.comparison-question > span { min-width: 0; }
.comparison-circle { display: grid; place-items: center; width: 76px; height: 76px; border: 3px solid #6d9ba9; border-radius: 50%; background: white; font-size: 46px; }
.comparison-circle.good { color: var(--green); border-color: var(--green); }
.comparison-circle.bad { color: var(--red); border-color: var(--red); }
.comparison-symbols { display: flex; justify-content: center; gap: 20px; margin-top: 30px; }
.comparison-symbols button { display: grid; justify-items: center; align-content: center; gap: 4px; width: 100px; height: 100px; border: 2px solid #b8cedd; border-radius: 8px; background: white; color: #2457a6; cursor: pointer; font: inherit; }
.comparison-symbols button:nth-child(2) { color: var(--green); }
.comparison-symbols button:nth-child(3) { color: #a46e15; }
.comparison-symbols strong { font-size: 44px; line-height: 1; }
.comparison-symbols button:hover:not(:disabled), .comparison-symbols button:focus-visible { outline: 3px solid #bcd9f8; outline-offset: 3px; }
.comparison-symbols button:disabled { cursor: default; }
.comparison-symbols button.selected { background: #e9f4fb; border-color: currentColor; }
.comparison-feedback { min-height: 28px; margin: 22px 0 6px; font-size: 20px; font-weight: 700; text-align: center; }
.comparison-feedback.good { color: var(--green); }
.comparison-feedback.bad { color: var(--red); }
.comparison-explanation { min-height: 50px; text-align: center; color: var(--muted); line-height: 1.6; margin: 0 0 16px; }
@media (max-width: 680px) {
  .exercise-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 0 8px; }
  .exercise-tabs button { font-size: 14px; padding: 10px 0; }
  .comparison-page { padding: 20px 14px; }
  .comparison-heading h1 { font-size: 22px; }
  .comparison-question { grid-template-columns: minmax(0, 1fr) 50px minmax(0, 1fr); gap: 8px; font-size: 25px; min-height: 150px; padding: 20px 8px; }
  .comparison-circle { width: 50px; height: 50px; font-size: 32px; }
  .comparison-symbols { gap: 12px; }
  .comparison-symbols button { width: 80px; height: 88px; }
  .comparison-stats { gap: 16px; }
}
  </style>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2433;
      --muted: #687386;
      --line: #d8e0ea;
      --paper: #fffdf8;
      --bg: #f4f7fb;
      --blue: #2f6fed;
      --blue-dark: #2356bc;
      --green: #23845a;
      --red: #c63e47;
      --yellow: #f3c64e;
      --shadow: 0 18px 45px rgba(47, 69, 103, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 12%, rgba(243, 198, 78, 0.23), transparent 32%),
        radial-gradient(circle at 80% 4%, rgba(47, 111, 237, 0.16), transparent 34%),
        linear-gradient(135deg, #f8fbff 0%, var(--bg) 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(980px, 100%);
      background: rgba(255, 253, 248, 0.92);
      border: 1px solid rgba(216, 224, 234, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .topbar {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
    }

    .stat {
      position: relative;
      padding: 18px 16px 20px;
      text-align: center;
      overflow: hidden;
      border-right: 1px solid rgba(255, 255, 255, 0.82);
    }

    .stat:last-child {
      border-right: 0;
    }

    .stat::before {
      content: attr(data-icon);
      width: 34px;
      height: 34px;
      display: inline-grid;
      place-items: center;
      border-radius: 50%;
      margin-bottom: 6px;
      font-size: 18px;
      font-weight: 800;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 8px 18px rgba(61, 80, 112, 0.12);
    }

    .stat.time {
      background: linear-gradient(135deg, #eaf4ff 0%, #dbeafe 100%);
      color: #2457a6;
    }

    .stat.right {
      background: linear-gradient(135deg, #e8f8ee 0%, #c9f0dd 100%);
      color: var(--green);
    }

    .stat.wrong {
      background: linear-gradient(135deg, #fff0f1 0%, #ffd8dc 100%);
      color: var(--red);
    }

    .stat.total {
      background: linear-gradient(135deg, #fff7d7 0%, #ffe8a3 100%);
      color: #9b6817;
    }

    .stat span {
      display: block;
      color: currentColor;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 5px;
      opacity: 0.82;
    }

    .stat strong {
      font-size: clamp(22px, 4vw, 34px);
      line-height: 1;
      color: currentColor;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(190px, 250px) minmax(0, 1fr);
      gap: clamp(18px, 4vw, 34px);
      padding: clamp(22px, 5vw, 46px);
      align-items: start;
      text-align: center;
    }

    .practice-area {
      min-width: 0;
    }

    .formula {
      min-height: 132px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.22em;
      font-weight: 800;
      font-size: clamp(42px, 8vw, 92px);
      line-height: 1;
      letter-spacing: 0;
      margin: 0 0 24px;
    }

    .answer-slot {
      min-width: 1.1em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-bottom: 8px solid var(--yellow);
      color: var(--blue);
    }

    input.answer-slot {
      width: 2.2em;
      min-width: 0;
      padding: 6px 2px;
      border: 2px solid #bed0e8;
      border-bottom: 5px solid var(--yellow);
      border-radius: 6px;
      background: white;
      text-align: center;
      font: inherit;
      line-height: 1.2;
      appearance: none;
    }
    input.answer-slot:focus { outline: 3px solid #d0e3fa; outline-offset: 2px; }
    input.answer-slot::placeholder { color: #687386; opacity: 1; }
    .answer-control { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .answer-form { margin-bottom: 20px; }
    .answer-form .formula { margin-bottom: 14px; }
    button, input { touch-action: manipulation; }
    button:disabled { opacity: 0.6; cursor: default; }

    .answer-slot.empty {
      color: var(--ink);
      border-bottom-color: transparent;
    }

    .answer-slot.good {
      color: var(--green);
      border-bottom-color: var(--green);
    }

    .answer-slot.bad {
      color: var(--red);
      border-bottom-color: var(--red);
    }

    .message {
      min-height: 36px;
      color: var(--muted);
      font-size: clamp(17px, 3vw, 22px);
      line-height: 1.4;
      margin: 0 auto 22px;
    }

    .message.good {
      color: var(--green);
      font-weight: 700;
    }

    .message.bad {
      color: var(--red);
      font-weight: 700;
    }

    .memory-card {
      position: sticky;
      top: 16px;
      background: linear-gradient(135deg, #fff8df 0%, #fff0f3 48%, #eaf7ff 100%);
      border: 1px solid rgba(243, 198, 78, 0.66);
      border-radius: 8px;
      padding: 16px;
      margin: 0;
      box-shadow: 0 10px 24px rgba(84, 97, 128, 0.1);
    }

    .memory-title {
      margin: 0 0 12px;
      color: #9b6817;
      font-size: clamp(17px, 3vw, 22px);
      font-weight: 900;
    }

    .memory-rhyme {
      display: grid;
      gap: 6px;
      margin: 0;
      color: #315071;
      font-size: clamp(15px, 2.5vw, 18px);
      font-weight: 800;
      line-height: 1.5;
    }

    .memory-rhyme span:nth-child(1) {
      color: #2457a6;
    }

    .memory-rhyme span:nth-child(2) {
      color: var(--green);
    }

    .memory-rhyme span:nth-child(3) {
      color: #8a4ab8;
    }

    .memory-rhyme span:nth-child(4) {
      color: var(--red);
    }

    .memory-rhyme span:nth-child(5) {
      color: #9b6817;
    }

    .mode-panel {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin: 0 0 12px;
    }

    .operation-panel {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 20px;
    }

    .specialty-panel {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      margin-bottom: 20px;
    }
    .specialty-panel .mode-button { padding: 10px 6px; }
    .mode-button small { display: block; margin-top: 5px; font-size: 14px; font-weight: 500; }
    .practice-label { margin: 14px 0 8px; text-align: left; font-size: 15px; color: var(--muted); }
    .formula { font-size: 40px; flex-wrap: wrap; }
    .formula > span { white-space: nowrap; }

    .mode-button {
      min-height: 48px;
      border: 1px solid #bed0e8;
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      font: inherit;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(42, 66, 104, 0.08);
    }

    .mode-button.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
    }

    .mode-button:hover,
    .mode-button:focus-visible {
      border-color: var(--blue);
      outline: none;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 24px;
    }

    .cube-choices { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin: 20px 0; }
    .cube-number { min-height: 48px; border: 1px solid #bed0e8; border-radius: 8px; background: white; color: var(--ink); font: inherit; font-size: 22px; font-weight: 800; cursor: pointer; }
    .cube-number:focus-visible { outline: 3px solid #bcd9f8; outline-offset: 2px; }
    .cube-number.selected { background: #e9f4fb; border-color: var(--blue); }

    .choice {
      appearance: none;
      border: 1px solid #bed0e8;
      background: #ffffff;
      color: var(--ink);
      border-radius: 8px;
      aspect-ratio: 1;
      min-width: 0;
      font: inherit;
      font-size: clamp(20px, 4vw, 30px);
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(42, 66, 104, 0.08);
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    .choice:hover,
    .choice:focus-visible {
      transform: translateY(-2px);
      border-color: var(--blue);
      outline: none;
    }

    .choice:disabled {
      cursor: default;
    }

    .choice.correct {
      background: #eaf8f1;
      border-color: var(--green);
      color: var(--green);
    }

    .choice.wrong {
      background: #fff0f1;
      border-color: var(--red);
      color: var(--red);
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .action {
      border: 0;
      border-radius: 8px;
      min-height: 46px;
      padding: 0 20px;
      background: var(--blue);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .action.secondary {
      background: #e8eef7;
      color: var(--ink);
    }

    .action.finish {
      background: #fff0f1;
      color: var(--red);
      border: 1px solid #f2a5ac;
    }

    .action.finish.active {
      background: var(--red);
      color: #ffffff;
      border-color: var(--red);
    }

    .action:hover,
    .action:focus-visible {
      background: var(--blue-dark);
      outline: none;
    }

    .action.secondary:hover,
    .action.secondary:focus-visible {
      background: #d9e3f1;
    }

    .action.finish:hover,
    .action.finish:focus-visible {
      background: #ffd8dc;
    }

    .action.finish.active:hover,
    .action.finish.active:focus-visible {
      background: var(--red);
    }

    .history-card {
      margin-top: 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.76);
      overflow: hidden;
      text-align: left;
    }

    .history-title {
      margin: 0;
      padding: 12px 14px;
      background: #f2f6fc;
      color: #315071;
      font-size: 16px;
      font-weight: 900;
      border-bottom: 1px solid var(--line);
    }
    .history-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; background: #f2f6fc; padding-right: 12px; border-bottom: 1px solid var(--line); }
    .history-heading .history-title { border: 0; }
    .history-clear { min-height: 44px; padding: 8px 12px; border: 0; background: transparent; color: var(--red); font: inherit; cursor: pointer; }
    .summary-bar { display: grid; grid-template-columns: minmax(260px, 1.8fr) minmax(0, 4fr); border-bottom: 1px solid var(--line); }
    .summary-bar.stars-only { grid-template-columns: 1fr; }
    .summary-bar .topbar { border-bottom: 0; }
    .summary-bar .stat { padding: 16px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .star-bar { display: flex; align-content: center; align-items: center; flex-wrap: wrap; gap: 10px; padding: 16px; background: #fff7d9; border-right: 1px solid #eed494; }
    .star-balance { margin: 0; font-size: 18px; color: #77510c; }
    .star-balance strong { margin: 0 5px; font-size: 28px; font-variant-numeric: tabular-nums; }
    .star-progress { margin: 4px 0 0; font-size: 13px; color: #786747; line-height: 1.5; }
    .star-redeem { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .star-redeem input { width: 64px; height: 44px; padding: 6px; border: 1px solid #c8ae6e; border-radius: 6px; font: inherit; font-size: 18px; background: white; text-align: center; }
    .star-redeem { font-size: 14px; gap: 6px; }
    .star-redeem .action { font-size: 14px; padding: 0 12px; min-height: 44px; }
    .star-status { width: 100%; margin: 0; font-size: 14px; color: #77510c; }
    .star-status:empty { display: none; }
    @media (max-width: 680px) { .summary-bar { grid-template-columns: 1fr; } .star-bar { padding: 14px; justify-content: space-between; border-right: 0; border-bottom: 1px solid #eed494; } .history-heading { padding-right: 6px; } }

    .history-list {
      display: grid;
      gap: 1px;
      margin: 0;
      padding: 0;
      list-style: none;
      background: var(--line);
    }

    .history-item {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 8px;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.35;
    }

    .history-item strong {
      color: var(--green);
      font-size: 16px;
    }

    .history-empty {
      margin: 0;
      padding: 14px;
      color: var(--muted);
      text-align: center;
    }

    .details-dialog {
      width: min(760px, calc(100% - 24px));
      max-height: 85vh;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
    }
    .details-dialog::backdrop { background: rgba(29, 36, 51, 0.45); }
    .details-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .details-header h2 { margin: 0; font-size: 20px; }
    .details-scroll { overflow: auto; margin-top: 16px; }
    .details-table { width: 100%; border-collapse: collapse; font-size: 15px; }
    .details-table th, .details-table td { padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--line); }
    .details-table th { background: #f2f6fc; }
    .details-correct { color: var(--green); }
    .details-wrong { color: var(--red); }
    .history-item button { justify-self: start; }

    @media (max-width: 680px) {
      body {
        padding: 12px;
      }

      .topbar {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .choices {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }
      .cube-choices { grid-template-columns: repeat(5, minmax(0, 1fr)); }

      .mode-panel {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .operation-panel {
        grid-template-columns: 1fr;
      }

      .formula {
        min-height: 104px;
      }

      .history-item {
        grid-template-columns: 1fr;
      }

      .stage {
        grid-template-columns: 1fr;
      }

      .memory-card {
        position: static;
      }
      body { padding: 8px; padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      .stage { padding: 18px 12px; gap: 20px; }
      .formula { font-size: 28px; gap: 8px; }
      .formula > span { white-space: normal; }
      .mode-button { font-size: 15px; padding: 8px 4px; }
      .actions { gap: 8px; }
      .action { padding: 0 14px; }
      .memory-card { padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none; }
      .memory-rhyme { gap: 2px; font-size: 15px; }
      .memory-title { margin-bottom: 6px; font-size: 18px; }
      .details-dialog { padding: 14px; }
      .details-table { font-size: 14px; }
      .details-table th, .details-table td { padding: 10px 5px; }
    }
  </style>
</head>
<body>
  <main aria-label="数学练习">
    <nav class="exercise-tabs" role="tablist" aria-label="练习页面">
      <button type="button" role="tab" id="arithmeticTab" aria-controls="arithmeticPage" aria-selected="true">加减法练习</button>
      <button type="button" role="tab" id="cubesTab" aria-controls="cubesPage" aria-selected="false" tabindex="-1">数方块</button>

  <script>
    let activePage = "arithmetic";
    let arithmeticPausedAt = null;
    const formulaTextEl = document.querySelector("#formulaText");
    const formulaPrefixEl = document.querySelector("#formulaPrefix");
    const startButton = document.querySelector("#startButton");
    const duration = 10 * 60 * 1000;
    const timedButton = document.querySelector("#timedButton");
    const hundredButton = document.querySelector("#hundredButton");
    const specialtyPanel = document.querySelector("#specialtyPanel");
    const operationLabels = {
      mixed: "加减混合", chainAdd: "连加", chainSub: "连减",
      addFirst: "找第一个加数（□ + 数 = 数）",
      addSecond: "找第二个加数（数 + □ = 数）",
      addResult: "求和（数 + 数 = □）",
      subFirst: "找被减数（□ - 数 = 数）",
      subSecond: "找减数（数 - □ = 数）",
      subResult: "求差（数 - 数 = □）"
    };
    const answerSlotEl = document.querySelector("#answerSlot");
    const answerForm = document.querySelector("#answerForm");
    const messageEl = document.querySelector("#message");
    const choicesEl = document.querySelector("#choices");
    const timerEl = document.querySelector("#timer");
    const rightCountEl = document.querySelector("#rightCount");
    const wrongCountEl = document.querySelector("#wrongCount");
    const totalCountEl = document.querySelector("#totalCount");
    const nextButton = document.querySelector("#nextButton");
    const resetButton = document.querySelector("#resetButton");
    const tenModeButton = document.querySelector("#tenModeButton");
    const twentyModeButton = document.querySelector("#twentyModeButton");
    const mixedModeButton = document.querySelector("#mixedModeButton");
    const chainAddButton = document.querySelector("#chainAddButton");
    const chainSubButton = document.querySelector("#chainSubButton");
    const finishButton = document.querySelector("#finishButton");
    const historyListEl = document.querySelector("#historyList");
    const historyKey = "mathPracticeResults";
    let sessionHistory = null;
    const rewardKey = "mathPracticeStars";
    const starStatus = document.querySelector("#starStatus");
    let rewards = loadRewards();

    function loadRewards() {
      try {
        const saved = JSON.parse(localStorage.getItem(rewardKey));
        if (saved && Number.isSafeInteger(saved.balance) && saved.balance >= 0 && Number.isSafeInteger(saved.progress) && saved.progress >= 0 && saved.progress < 10) {
          return { balance: saved.balance, progress: saved.progress };
        }
      } catch (error) {
        // Keep practice usable if local storage is unavailable.
      }
      return { balance: 0, progress: 0 };
    }

    function renderRewards() {
      document.querySelector("#starBalance").textContent = rewards.balance;
      document.querySelector("#starProgress").textContent = `加减法再答对${10 - rewards.progress}题，获得1颗星星`;
    }

    function persistRewards() {
      renderRewards();
      try {
        localStorage.setItem(rewardKey, JSON.stringify(rewards));
      } catch (error) {
        starStatus.textContent = "当前浏览器无法保存星星，关闭页面后可能丢失。";
      }
    }

    function rewardCorrectAnswer() {
      rewards.progress += 1;
      if (rewards.progress === 10) {
        rewards.progress = 0;
        rewards.balance += 1;
        starStatus.textContent = "累计答对10题，获得1颗星星！";
      }
      persistRewards();
    }
    const detailsButton = document.querySelector("#detailsButton");
    const detailsDialog = document.querySelector("#detailsDialog");
    const retryWrongButton = document.querySelector("#retryWrongButton");
    let viewedRecord = null;
    let latestRecord = null;

    const state = {
      maxNumber: 20,
      operation: "mixed",
      trainingMode: "timed",
      reviewQueue: [],
      reviewLabel: "",
      answer: 0,
      typedAnswer: "",
      attempts: [],
      right: 0,
      wrong: 0,
      total: 0,
      answered: false,
      finished: false,
      running: false,
      recordSaved: false,
      startedAt: Date.now(),
      timerId: null,
      nextQuestionId: null
    };

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function splitIntoTwo(total) {
      const first = randomInt(1, total - 1);
      return [first, total - first];
    }

    function makeQuestion() {
      clearTimeout(state.nextQuestionId);
      if (state.finished) {
        return;
      }

      if (state.trainingMode === "review") {
        const question = state.reviewQueue[state.total];
        if (!question) return;
        const [prefix, suffix] = question.question.split("□");
        formulaPrefixEl.textContent = prefix.trim();
        formulaTextEl.textContent = suffix.trim();
        state.answer = question.answer;
        prepareQuestionInput();
        return;
      }

      const isAddition = state.operation.startsWith("add") ||
        (state.operation === "mixed" && Math.random() >= 0.5);
      let left;
      let right;
      let answer;

      if (state.operation === "chainAdd") {
        answer = randomInt(3, state.maxNumber);
        left = randomInt(1, answer - 2);
        right = randomInt(1, answer - left - 1);
        const third = answer - left - right;
        formulaTextEl.textContent = `${left} + ${right} + ${third} =`;
      } else if (state.operation === "chainSub") {
        left = randomInt(3, state.maxNumber);
        answer = randomInt(1, left - 2);
        const [firstSub, secondSub] = splitIntoTwo(left - answer);
        formulaTextEl.textContent = `${left} - ${firstSub} - ${secondSub} =`;
      } else if (isAddition) {
        answer = randomInt(2, state.maxNumber);
        left = randomInt(1, answer - 1);
        right = answer - left;
      } else {
        left = randomInt(2, state.maxNumber);
        answer = randomInt(1, left - 1);
        right = left - answer;
        formulaTextEl.textContent = `${left} - ${right} =`;
      }

      if (isAddition) {
        formulaTextEl.textContent = `${left} + ${right} =`;
      }

      const tokens = `${formulaTextEl.textContent} ${answer}`.trim().split(/\s+/);
      const positions = tokens.map((token, index) => /^\d+$/.test(token) ? index : -1).filter((index) => index >= 0);
      const fixedPosition = state.operation.endsWith("First") ? 0 :
        state.operation.endsWith("Second") ? 1 : state.operation.endsWith("Result") ? 2 : null;
      const blank = positions[fixedPosition === null ? randomInt(0, positions.length - 1) : fixedPosition];
      state.answer = Number(tokens[blank]);
      formulaPrefixEl.textContent = tokens.slice(0, blank).join(" ");
      formulaTextEl.textContent = tokens.slice(blank + 1).join(" ");
      prepareQuestionInput();
    }

    function prepareQuestionInput() {
      state.answered = false;
      nextButton.disabled = true;
      state.typedAnswer = "";
      answerSlotEl.value = "";
      answerSlotEl.readOnly = true;
      answerSlotEl.className = "answer-slot empty";
      messageEl.textContent = "";
      messageEl.className = "message";

      document.querySelectorAll(".choice").forEach((button) => {
        button.classList.remove("correct", "wrong");
        button.disabled = !state.running;
      });
    }

    function renderChoices() {
      choicesEl.innerHTML = "";
      for (let number = 0; number <= 9; number += 1) {
        const button = document.createElement("button");
        button.className = "choice";
        button.type = "button";
        button.textContent = number;
        button.dataset.value = String(number);
        button.setAttribute("aria-label", `输入数字 ${number}`);
        choicesEl.appendChild(button);
      }
    }

    function updateStats() {
      rightCountEl.textContent = state.right;
      wrongCountEl.textContent = state.wrong;
      totalCountEl.textContent = state.trainingMode === "review" ? `${state.total}/${state.reviewQueue.length}` : state.trainingMode === "hundred" ? `${state.total}/100` : state.total;
    }

    function formatTime(milliseconds) {
      const totalSeconds = Math.floor(milliseconds / 1000);
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
      const seconds = String(totalSeconds % 60).padStart(2, "0");
      return `${minutes}:${seconds}`;
    }

    function startTimer() {
      clearInterval(state.timerId);
      state.startedAt = Date.now();
      state.finished = false;
      state.running = true;
      timerEl.textContent = state.trainingMode !== "timed" ? "00:00" : "10:00";
      state.timerId = setInterval(updateCountdown, 200);
    }

    function updateCountdown() {
      if (!state.running || activePage !== "arithmetic") return;
      if (state.trainingMode !== "timed") {
        timerEl.textContent = formatTime(Date.now() - state.startedAt);
        return;
      }
      const remaining = Math.max(0, duration - (Date.now() - state.startedAt));
      timerEl.textContent = formatTime(Math.ceil(remaining / 1000) * 1000);
      if (remaining === 0) finishGame();
    }

    function markWrongChoice(selected) {
      const button = document.querySelector(`.choice[data-value="${selected}"]`);
      if (button) {
        button.classList.add("wrong");
        button.disabled = true;
      }
    }

    function submitAnswer(selected) {
      if (!state.running || state.finished || state.answered || !Number.isInteger(selected)) {
        return;
      }
      if (state.trainingMode === "timed" && Date.now() - state.startedAt >= duration) {
        finishGame();
        return;
      }

      if (selected < 0) {
        answerSlotEl.value = String(selected);
        answerSlotEl.className = "answer-slot bad";
        messageEl.textContent = `请输入 1 到 ${state.maxNumber} 之间的数字`;
        messageEl.className = "message bad";
        state.typedAnswer = "";
        return;
      }

      state.total += 1;
      state.attempts.push({
        question: `${formulaPrefixEl.textContent} □ ${formulaTextEl.textContent}`.trim(),
        selected,
        answer: state.answer,
        correct: selected === state.answer
      });
      state.answered = true;
      answerSlotEl.value = String(selected);
      answerSlotEl.readOnly = true;

      if (selected === state.answer) {
        state.answered = true;
        state.right += 1;
        rewardCorrectAnswer();
        answerSlotEl.className = "answer-slot good";
        const correctButton = document.querySelector(`.choice[data-value="${selected}"]`);
        if (correctButton) {
          correctButton.classList.add("correct");
        }
        document.querySelectorAll(".choice").forEach((choice) => {
          choice.disabled = true;
        });
        messageEl.textContent = "答对了！";
        messageEl.className = "message good";
      } else {
        state.wrong += 1;
        answerSlotEl.className = "answer-slot bad";
        state.typedAnswer = "";
        markWrongChoice(selected);
        messageEl.textContent = "答错了，继续下一题";
        messageEl.className = "message bad";
      }

      updateStats();
      document.querySelectorAll(".choice").forEach((choice) => {
        choice.disabled = true;
      });
      clearTimeout(state.nextQuestionId);
      if ((state.trainingMode === "hundred" && state.total >= 100) || (state.trainingMode === "review" && state.total >= state.reviewQueue.length)) {
        finishGame();
        return;
      }
      state.nextQuestionId = setTimeout(() => {
        updateCountdown();
        if (state.running) makeQuestion();
      }, 800);
    }

    function chooseAnswer(event) {
      const button = event.target.closest(".choice");
      if (!button || button.disabled) {
        return;
      }

      appendArithmeticDigit(button.dataset.value);
    }

    function appendArithmeticDigit(digit) {
      if (activePage !== "arithmetic" || !state.running || state.answered) return;
      if (!/^\d$/.test(digit)) return;
      state.typedAnswer += digit;
      answerSlotEl.value = state.typedAnswer;
      answerSlotEl.className = "answer-slot";
      const selected = Number(state.typedAnswer);
      const expected = String(state.answer);
      if (!expected.startsWith(state.typedAnswer) || state.typedAnswer.length === expected.length) submitAnswer(selected);
    }

    function resetGame() {
      clearTimeout(state.nextQuestionId);
      clearInterval(state.timerId);
      state.running = false;
      state.finished = false;
      state.right = 0;
      state.wrong = 0;
      state.total = 0;
      state.recordSaved = false;
      state.attempts = [];
      detailsButton.hidden = true;
      finishButton.classList.remove("active");
      updateStats();
      timerEl.textContent = state.trainingMode !== "timed" ? "00:00" : "10:00";
      document.querySelector("#totalLabel").textContent = state.trainingMode === "review" ? "错题重做进度" : "已答题数";
      document.querySelector("#timerLabel").textContent = state.trainingMode !== "timed" ? "总用时" : "剩余时间";
      startButton.disabled = false;
      nextButton.disabled = true;
      finishButton.disabled = true;
      renderChoices();
      makeQuestion();
      messageEl.textContent = "准备好了";
    }

    function startGame() {
      if (state.running) return;
      resetGame();
      startTimer();
      startButton.disabled = true;
      finishButton.disabled = false;
      makeQuestion();
      answerSlotEl.focus();
    }

    function handleKeyboard(event) {
      if (activePage !== "arithmetic" || detailsDialog.open) return;
      if (event.target && event.target !== answerSlotEl && (event.target.matches("input, textarea, select") || event.target.isContentEditable)) return;
      if (!state.running || event.ctrlKey || event.metaKey || event.altKey || event.isComposing) return;
      if (!/^\d$/.test(event.key) && !["Enter", "Backspace", "Escape"].includes(event.key)) return;
      event.preventDefault();
      updateCountdown();
      if (!state.running || state.answered || event.repeat) return;
      if (/^\d$/.test(event.key)) {

    const points = (items) => items.map(([dx, dy]) => `${px + dx},${py + dy}`).join(" ");
    return `<g stroke="${reference ? "#8a652b" : "#94652c"}" stroke-width="1.5" stroke-linejoin="round">

const comparisonCircle = document.querySelector("#comparisonCircle");
const comparisonFeedback = document.querySelector("#comparisonFeedback");
const comparisonExplanation = document.querySelector("#comparisonExplanation");

function comparisonSide(value, expression) {
  if (!expression) return { text: String(value), value };
  if (Math.random() < 0.5 && value >= 2) {
    const first = randomInt(1, value - 1);
    return { text: `${first} + ${value - first}`, value };
  }
  const first = randomInt(value, comparisonState.maxNumber);
  return { text: `${first} - ${first - value}`, value };
}

function newComparisonQuestion() {
  clearTimeout(comparisonState.nextQuestionId);
  // Balance the three relations so equality gets as much practice as inequality.
  const relation = randomInt(0, 2);
  let leftValue;
  let rightValue;
  if (relation === 0) {
    leftValue = randomInt(1, comparisonState.maxNumber);
    rightValue = randomInt(0, leftValue - 1);
  } else if (relation === 1) {
    rightValue = randomInt(1, comparisonState.maxNumber);
    leftValue = randomInt(0, rightValue - 1);
  } else {
    leftValue = rightValue = randomInt(0, comparisonState.maxNumber);
  }
  const expressionOnLeft = comparisonState.mode === "both" || (comparisonState.mode === "expression" && Math.random() < 0.5);
  const expressionOnRight = comparisonState.mode === "both" || (comparisonState.mode === "expression" && !expressionOnLeft);
  comparisonState.left = comparisonSide(leftValue, expressionOnLeft);
  comparisonState.right = comparisonSide(rightValue, expressionOnRight);
  comparisonState.symbol = leftValue > rightValue ? ">" : leftValue < rightValue ? "<" : "=";
  comparisonState.answered = false;
  document.querySelector("#comparisonLeft").textContent = comparisonState.left.text;
  document.querySelector("#comparisonRightSide").textContent = comparisonState.right.text;
  comparisonCircle.textContent = "";
  comparisonCircle.className = "comparison-circle";
  comparisonCircle.setAttribute("aria-label", "待填比较符号");
  comparisonFeedback.textContent = "";
  comparisonFeedback.className = "comparison-feedback";
  comparisonExplanation.textContent = "";
  document.querySelectorAll("[data-symbol]").forEach((button) => {
    button.disabled = false;
    button.classList.remove("selected");
    button.setAttribute("aria-pressed", "false");
  });
}

function updateComparisonStats() {
  document.querySelector("#comparisonRight").textContent = comparisonState.correct;
  document.querySelector("#comparisonWrong").textContent = comparisonState.wrong;
  document.querySelector("#comparisonTotal").textContent = comparisonState.correct + comparisonState.wrong;
}

function submitComparison(symbol) {
  if (activePage !== "comparison" || comparisonState.answered || !(symbol in comparisonNames)) return;
  comparisonState.answered = true;
  const correct = symbol === comparisonState.symbol;
  comparisonState[correct ? "correct" : "wrong"] += 1;
  comparisonCircle.textContent = symbol;
  comparisonCircle.className = `comparison-circle ${correct ? "good" : "bad"}`;
  comparisonCircle.setAttribute("aria-label", `所选符号：${comparisonNames[symbol]}`);
  comparisonFeedback.textContent = correct ? "答对了！" : `答错了，应该选“${comparisonNames[comparisonState.symbol]}”`;
  comparisonFeedback.className = `comparison-feedback ${correct ? "good" : "bad"}`;
  const left = comparisonState.left;
  const right = comparisonState.right;
  const calculations = [left, right].filter((side) => /[+-]/.test(side.text)).map((side) => `${side.text} = ${side.value}`);
  comparisonExplanation.textContent = [...calculations, `${left.value} ${comparisonState.symbol} ${right.value}`].join("，");
  document.querySelectorAll("[data-symbol]").forEach((button) => {
    button.disabled = true;
    button.classList.toggle("selected", button.dataset.symbol === symbol);
    button.setAttribute("aria-pressed", String(button.dataset.symbol === symbol));
  });
  updateComparisonStats();
  if (correct) comparisonState.nextQuestionId = setTimeout(newComparisonQuestion, 800);
}

document.querySelectorAll("[data-symbol]").forEach((button) => {
  button.addEventListener("click", () => submitComparison(button.dataset.symbol));
});
document.querySelectorAll("[data-comparison-mode]").forEach((button) => {
  button.addEventListener("click", () => {
    comparisonState.mode = button.dataset.comparisonMode;
    document.querySelectorAll("[data-comparison-mode]").forEach((item) => {
      item.classList.toggle("active", item === button);
      item.setAttribute("aria-pressed", String(item === button));
    });
    newComparisonQuestion();
  });
});
document.querySelectorAll("[data-comparison-range]").forEach((button) => {
  button.addEventListener("click", () => {
    comparisonState.maxNumber = Number(button.dataset.comparisonRange);
    document.querySelectorAll("[data-comparison-range]").forEach((item) => {
      item.classList.toggle("active", item === button);
      item.setAttribute("aria-pressed", String(item === button));
    });
    document.querySelector("#comparisonRangeLabel").textContent = `${comparisonState.maxNumber}以内的大小比较`;
    newComparisonQuestion();
  });
});
document.querySelector("#comparisonNext").addEventListener("click", newComparisonQuestion);
document.querySelector("#comparisonReset").addEventListener("click", () => {
  comparisonState.correct = 0;
  comparisonState.wrong = 0;
  updateComparisonStats();
  newComparisonQuestion();
});
newComparisonQuestion();
  </script>
</body>
</html>
