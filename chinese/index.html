<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>一年级拼音练习</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header><div><h1>拼音练习</h1><p>一年级 · 汉语拼音</p></div><a href="../index.html">数学练习 →</a></header>
    <nav class="page-tabs" role="tablist" aria-label="拼音学习方式">
      <button type="button" role="tab" id="blendTab" aria-controls="blendPanel" aria-selected="true">拼读练习</button>
      <button type="button" role="tab" id="quizTab" aria-controls="quizPanel" aria-selected="false" tabindex="-1">答题练习</button>
    </nav>
    <section class="blend-panel" id="blendPanel" role="tabpanel" aria-labelledby="blendTab">
      <h2>声母</h2><div class="blend-initials" id="blendInitials" role="group" aria-label="选择声母"></div>
      <h2>带声调韵母</h2><div class="blend-finals" id="blendFinals" role="group" aria-label="选择带声调韵母"></div>
      <div class="blend-result">
        <div class="blend-formula" aria-label="拼读组合"><span id="blendInitial">b</span><span>+</span><span id="blendFinal">ā</span><span>=</span><strong id="blendSyllable">bā</strong></div>
        <div class="blend-word"><strong id="blendCharacter">八</strong><span id="blendTone">第一声</span></div>
        <p id="blendSpelling" class="blend-note" hidden>j、q、x 与 ü 相拼时，ü 上两点省去。</p>
        <div class="actions"><button class="action" type="button" id="blendListen">汉字带读</button><button class="action secondary" type="button" id="blendRandom">换一个</button><button class="action secondary" type="button" id="blendStop">停止播放</button></div>
      </div>
      <div class="voice-settings"><label for="blendVoice">中文声音</label><select id="blendVoice" aria-label="中文声音"></select><label for="blendRate">语速</label><select id="blendRate"><option value="0.65">慢速</option><option value="0.85" selected>正常</option></select></div>
      <p class="blend-note">播放对应汉字的系统读音，非标准拼音录音。读音随设备变化，请家长先试听。</p>
      <p class="blend-status" id="blendStatus" role="status"></p>
    </section>
    <div id="quizPanel" role="tabpanel" aria-labelledby="quizTab" hidden>
    <section class="stats" aria-label="练习统计">
      <div><span>答对</span><strong id="right">0</strong></div><div><span>进度</span><strong id="progress">0/10</strong></div><div><span>答错</span><strong id="wrong">0</strong></div><div><span>用时</span><strong id="time">00:00</strong></div>
    </section>
    <section class="workspace">
      <div class="modes" role="group" aria-label="练习类型">
        <button type="button" data-mode="groups" aria-pressed="true">拼音分类</button><button type="button" data-mode="words" aria-pressed="false">看拼音选汉字</button><button type="button" data-mode="tones" aria-pressed="false">声调练习</button>
      </div>
      <div class="settings"><label>题数 <select id="length"><option value="10">10题</option><option value="20">20题</option></select></label><span id="sessionLabel">准备开始</span></div>
      <div class="question"><p class="prompt" id="prompt"></p><p class="stem" id="stem" lang="zh-Latn"></p></div>
      <div class="options" id="options" aria-label="选择答案"></div>
      <p class="feedback" id="feedback" role="status"></p>
      <div class="actions"><button type="button" class="action" id="start">开始练习</button><button type="button" class="action secondary" id="next" disabled>下一题</button><button type="button" class="action secondary" id="finish" disabled>结束</button><button type="button" class="action secondary" id="details" hidden>本次详情</button></div>
    </section>
    <section class="history"><h2>最近10次成绩</h2><div id="history"></div></section>
    </div>
  </main>
  <dialog id="detailDialog" aria-labelledby="detailTitle"><div class="dialog-head"><h2 id="detailTitle">答题详情</h2><form method="dialog"><button class="action secondary" type="submit">关闭</button></form></div><p id="summary"></p><button class="action" type="button" id="retry">错题重做</button><div id="rows"></div></dialog>
  <script src="app.js" defer></script>
</body>
</html>
